name: 股票监控

on:
  schedule:
    # 每 5 分钟 3 条偏移 cron，保证任何时点挂了最多 5min 恢复
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 * * * *'
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

# 防重叠：同一时间只跑一个实例
concurrency: monitor

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3             # 单次 ≤3min，挂了立刻释放
    permissions:
      contents: read

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install httpx pyyaml deep-translator

      - name: 恢复去重记录
        uses: actions/cache/restore@v4
        id: cache
        with:
          path: tweets.db
          key: monitor-db-v1

      - name: 单次检查
        run: python github_main.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TARGET_USER: ${{ vars.TARGET_USER || 'aleabitoreddit' }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}

      - name: 保存去重记录
        uses: actions/cache/save@v4
        if: always()
        with:
          path: tweets.db
          key: monitor-db-v1
