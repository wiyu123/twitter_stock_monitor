name: 股票监控

on:
  schedule:
    - cron: '0 * * * *'        # 每小时 4 个偏移 cron 保底
    - cron: '15 * * * *'
    - cron: '30 * * * *'
    - cron: '45 * * * *'
  workflow_dispatch:

concurrency: monitor

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360       # 6 小时上限
    permissions:
      contents: read
      actions: write

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install httpx pyyaml deep-translator

      - name: 恢复去重记录
        uses: actions/cache/restore@v4
        id: cache
        with:
          path: tweets.db
          key: monitor-db-v1

      - name: 运行监控 (2min/次 × ~355min)
        run: python github_main.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TARGET_USER: ${{ vars.TARGET_USER || 'aleabitoreddit' }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}

      - name: 保存去重记录
        uses: actions/cache/save@v4
        if: always()
        with:
          path: tweets.db
          key: monitor-db-v1

      - name: 自触发续命 (需 GH_PAT)
        if: always()
        run: |
          if [ -n "${{ secrets.GH_PAT }}" ]; then
            sleep 10
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/monitor.yml/dispatches" \
              -d '{"ref":"main"}')
            echo "Self-trigger: HTTP $HTTP"
          else
            echo "⚠️  未设置 GH_PAT，依赖 cron 保底"
          fi
